<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solomon Inventory</title>
  <link rel="stylesheet" href="pinecrest.css">
  <link rel="stylesheet" href="inventory.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="inventory-container">
    <!-- Header Bar -->
    <div class="header">
      <span class="logo">Solomon Inventory</span>
      <input type="text" id="search" placeholder="Search items..." oninput="handleSearch(this.value)">
      <select id="sort" onchange="handleSort(this.value)">
        <option value="name-asc">Name A-Z</option>
        <option value="name-desc">Name Z-A</option>
        <option value="qty-high">Quantity High</option>
        <option value="qty-low">Quantity Low</option>
        <option value="price-high">Price High</option>
        <option value="price-low">Price Low</option>
      </select>
      <select id="location" onchange="handleLocationFilter(this.value)">
        <option value="all">All Locations</option>
        <option value="vault">Main Vault</option>
        <option value="north">North Warehouse</option>
        <option value="south">South Depot</option>
        <option value="trading">Trading Post</option>
        <option value="nether">Nether Hub</option>
        <option value="end">End Outpost</option>
      </select>
      <button class="close-btn" onclick="closeOverlay()" title="Close">&times;</button>
    </div>

    <!-- Grid Container -->
    <div class="grid-container">
      <div class="inventory-grid" id="grid">
        <!-- Populated by JavaScript -->
      </div>
    </div>
  </div>

  <!-- Drawer Backdrop -->
  <div class="drawer-backdrop" id="backdrop" onclick="closeDrawer()"></div>

  <!-- Item Detail Drawer -->
  <div class="drawer" id="drawer">
    <div class="drawer-header">
      <img id="detail-icon" class="item-icon-lg" src="" alt="">
      <div class="item-info">
        <div class="item-name" id="detail-name"></div>
        <div class="item-mcid" id="detail-mcid"></div>
      </div>
      <button class="close-btn" onclick="closeDrawer()">&times;</button>
    </div>

    <div class="drawer-content">
      <!-- Price Section -->
      <div class="price-section">
        <div class="current-price" id="detail-price"></div>
        <div class="price-change" id="detail-change">
          <span class="arrow" id="detail-arrow"></span>
          <span id="detail-change-value"></span>
        </div>
        <div class="base-price" id="detail-base-price"></div>
      </div>

      <!-- Stock Section -->
      <div class="stock-section">
        <div class="stock-header">
          <span class="stock-label">Stock Level</span>
          <span class="stock-value" id="detail-stock-text"></span>
        </div>
        <div class="stock-bar-container">
          <div class="stock-bar" id="detail-stock-bar"></div>
        </div>
        <div class="stock-actions">
          <button class="btn-secondary" onclick="handleIncreaseTarget()">+ Increase Target</button>
          <button class="btn-ghost" onclick="handleDecreaseTarget()">- Decrease Target</button>
        </div>
      </div>

      <!-- Price Chart -->
      <div class="chart-section">
        <h4>7-Day Price History</h4>
        <div class="chart-container">
          <canvas id="price-chart"></canvas>
        </div>
      </div>

      <!-- Market Indicators -->
      <div class="market-indicators">
        <div class="indicator supply">
          <div class="indicator-label">Supply</div>
          <div class="indicator-value" id="detail-supply"></div>
        </div>
        <div class="indicator demand">
          <div class="indicator-label">Demand</div>
          <div class="indicator-value" id="detail-demand"></div>
        </div>
        <div class="indicator pressure">
          <div class="indicator-label">Build</div>
          <div class="indicator-value" id="detail-pressure"></div>
        </div>
      </div>

      <!-- Recent Trades -->
      <div class="recent-trades">
        <h4>Recent Trades</h4>
        <div class="trade-list" id="detail-trades">
          <!-- Populated by JavaScript -->
        </div>
      </div>
    </div>
  </div>

  <script src="inventory.js"></script>
</body>
</html>
